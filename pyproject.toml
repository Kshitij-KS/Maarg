[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mit-global-ai-truth-layer"
version = "0.1.0"
description = "Truth Layer for MIT Hackathon C03 Indian Healthcare Reasoning Auditor"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk",
    "mlflow>=3",
    "openpyxl",
    "pandas",
    "pydantic>=2",
    "pyspark",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/shared"]
